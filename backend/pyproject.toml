[project]
name = "novelai-desktop-backend"
version = "0.1.0"
description = "FastAPI sidecar for novelai-desktop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2",
    "keyring>=25",
    "Pillow>=10",
    "httpx>=0.27",  # runtime: the NovelAI client + generate router import it at module level
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
