# Cross-platform desktop build: freeze the FastAPI sidecar with PyInstaller, build the Vue frontend, then
# package the Electron shell with electron-builder. Windows, macOS and Linux run on their own native runners
# because PyInstaller cannot cross-compile. Unsigned for now (signing is a deliberate later step — see the env
# seams below). Artifacts are uploaded per-OS. A `v*` tag additionally publishes a GitHub Release with the
# Windows installer + portable exe, the macOS dmg (Apple Silicon) and the Linux AppImage (x64) attached.
name: build

on:
  workflow_dispatch: {}   # manual build — artifacts only, no release
  push:
    tags:
      - "v*"              # tagging v1.0.0 builds all targets and publishes the v1.0.0 release

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_flag: "--win"
          - os: macos-latest       # Apple Silicon (arm64) only — the frozen sidecar is native-arch; an x64
            builder_flag: "--mac"   # dmg would ship an arm64 backend. Intel builds need a separate Rosetta step.
          - os: ubuntu-latest      # x64 AppImage — one file that runs on most distributions
            builder_flag: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Backend: install + freeze the sidecar -------------------------------------------------
      - name: Install backend (+ build tools)
        # NON-editable on purpose: an editable (PEP 660) install makes PyInstaller bundle a finder shim
        # instead of the real `app` package, so the frozen binary would secretly depend on the source tree.
        run: python -m pip install "./backend[build]"

      - name: Build frontend (bundled into the frozen backend at /app/)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Freeze sidecar (PyInstaller)
        working-directory: backend
        run: pyinstaller --noconfirm novelai-backend.spec
        # -> backend/dist/novelai-backend/  (onedir: exe + libs + bundled frontend/dist + tokenizer model)

      # --- Shell: package the Electron app -------------------------------------------------------
      - name: Install shell deps
        working-directory: shell
        run: npm ci

      - name: Package (electron-builder, unsigned)
        working-directory: shell
        run: npx electron-builder ${{ matrix.builder_flag }} --publish never
        env:
          # Unsigned build: tell electron-builder not to attempt macOS signing/notarization. When signing is
          # enabled later, drop CSC_IDENTITY_AUTOUPDATE and provide CSC_LINK / CSC_KEY_PASSWORD (macOS) or the
          # win.certificateFile secrets instead.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novelai-desktop-${{ matrix.os }}
          path: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.AppImage
          if-no-files-found: error

  # --- Release: tag push only ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches shell version
        # electron-builder names files from shell/package.json, so a tag/version mismatch would publish
        # e.g. "v1.1.0" carrying "Setup-1.0.0.exe". Bump `version` in shell/package.json before tagging.
        run: |
          version=$(node -p "require('./shell/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match shell/package.json version $version"
            exit 1
          fi

      - name: Download every platform's artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: novelai-desktop-*
          merge-multiple: true
          path: release

      - name: Publish GitHub release (Windows, macOS, Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        # The builds are unsigned, so each OS asks once before the first start — the notes say how.
        run: |
          cat > notes.md <<'EOF'
          **Downloads:** Windows — `Setup` (installer) or `portable` exe · macOS (Apple Silicon) — `arm64.dmg` · Linux (x64) — `x86_64.AppImage`.

          The builds aren't signed yet, so on first start:
          - **Windows:** SmartScreen → *More info* → *Run anyway*.
          - **macOS:** after moving the app to Applications, run `xattr -cr "/Applications/NovelAI Desktop.app"` once (otherwise macOS reports it as damaged).
          - **Linux:** `chmod +x` the AppImage. If it won't start (newer Ubuntu limits Electron's sandbox), run it with `--no-sandbox`. Saving the NovelAI token needs a keyring (GNOME Keyring or KWallet).
          EOF
          gh release create "$GITHUB_REF_NAME" release/*.exe release/*.dmg release/*.AppImage \
            --title "NovelAI Desktop $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
